name: Build Linux Packages (Qt 6.10.3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: YourApp
  QT_VERSION: '6.10.3'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libfuse2 \
            patchelf \
            zstd \
            rpm \
            libarchive-tools \
            ruby \
            ruby-dev
          sudo gem install fpm -v 1.15.1 --no-document

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          
          SAFE_VERSION=$(echo "${{ env.VERSION }}" | sed 's/-/~/')
          echo "SAFE_VERSION=$SAFE_VERSION" >> "$GITHUB_ENV"

      - name: Build with qmake
        run: |
          mkdir -p build
          cd build
          qmake CONFIG+=release PREFIX=/usr ../YourProject.pro
          make -j"$(nproc)"

      - name: Prepare AppDir
        run: |
          APP_DIR="$PWD/AppDir"
          mkdir -p "$APP_DIR/usr/bin"
          cp build/YourApp "$APP_DIR/usr/bin/"

          mkdir -p "$APP_DIR/usr/share/applications"
          if [ -f resources/yourapp.desktop ]; then
            cp resources/yourapp.desktop "$APP_DIR/usr/share/applications/"
          else
            cat > "$APP_DIR/usr/share/applications/yourapp.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=YourApp
          Exec=YourApp
          Icon=application-x-executable
          Categories=Utility;
          Terminal=false
          EOF
          fi

          if [ -f resources/yourapp.png ]; then
            mkdir -p "$APP_DIR/usr/share/icons/hicolor/256x256/apps"
            cp resources/yourapp.png "$APP_DIR/usr/share/icons/hicolor/256x256/apps/"
          fi

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(which qmake)"
          export NO_STRIP=true

          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage

          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          ln -sf linuxdeploy-plugin-qt.AppImage linuxdeploy-plugin-qt
          
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/YourApp \
            --desktop-file AppDir/usr/share/applications/yourapp.desktop \
            --plugin qt \
            --output appimage

          mv YourApp*.AppImage "YourApp-${{ env.VERSION }}-linux-x86_64.AppImage"

      - name: Build deb and rpm with fpm
        run: |
          FPM_WORKDIR="${{ runner.temp }}/fpm-workdir"
          mkdir -p "$FPM_WORKDIR"

          for target in deb rpm; do
            fpm -s dir -t "$target" \
              --workdir "$FPM_WORKDIR" \
              -a x86_64 \
              -n yourapp \
              -v "${{ env.SAFE_VERSION }}" \
              --maintainer "you@example.com" \
              --description "Your application description" \
              --url "https://github.com/${{ github.repository }}" \
              --license "MIT" \
              --deb-depends "qt6-base" \
              --rpm-depends "qt6-qtbase" \
              -p "YourApp-${{ env.VERSION }}-1.x86_64.${target}" \
              AppDir/=/
          done

      - name: Build Arch Linux package
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ env.VERSION }}/" PKGBUILD
          
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Sy --noconfirm base-devel qt6-base qt6-tools
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /src
              su builder -c "
                cd /src
                # -s 会自动安装 makedepends 中声明的依赖
                makepkg -s --noconfirm --skipchecksums
              "
            '
          package() {
              install -Dm755 "${srcdir}/../build/YourApp" "${pkgdir}/usr/bin/YourApp"
              if [ -f "${srcdir}/../AppDir/usr/share/applications/yourapp.desktop" ]; then
                  install -Dm644 "${srcdir}/../AppDir/usr/share/applications/yourapp.desktop" "${pkgdir}/usr/share/applications/yourapp.desktop"
              fi
              if [ -f "${srcdir}/../AppDir/usr/share/icons/hicolor/256x256/apps/yourapp.png" ]; then
                  install -Dm644 "${srcdir}/../AppDir/usr/share/icons/hicolor/256x256/apps/yourapp.png" "${pkgdir}/usr/share/icons/hicolor/256x256/apps/yourapp.png"
              fi
          }
          EOF

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Sy --noconfirm base-devel qt6-base qt6-tools
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /src
              su builder -c "
                cd /src
                makepkg -s --noconfirm --skipchecksums
              "
            '

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            YourApp-*-linux-x86_64.AppImage
            YourApp-*-1.x86_64.deb
            YourApp-*-1.x86_64.rpm
            *.pkg.tar.zst
