name: Build Linux Packages (Qt 6.10.3)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  APP_NAME: YourApp
  QT_VERSION: '6.10.3'

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1. 安装 Qt 6.10.3 (Linux GCC 64-bit) ----------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      # ---------- 2. 安装构建与打包工具 ----------
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgl1-mesa-dev \
            libfuse2 \
            rpm \
            libarchive-tools
          sudo gem install fpm -v 1.15.1

      # ---------- 3. qmake + make 构建 ----------
      - name: Build with qmake
        run: |
          mkdir -p build
          cd build
          qmake CONFIG+=release PREFIX=/usr ../YourProject.pro
          make -j"$(nproc)"

      # ---------- 4. 准备统一的 AppDir ----------
      - name: Prepare AppDir
        run: |
          APP_DIR="$PWD/AppDir"
          mkdir -p "$APP_DIR/usr/bin"
          cp build/YourApp "$APP_DIR/usr/bin/"

          # 如果仓库中有 desktop / 图标，复制进去；
          # 如果 linuxdeploy 能自动生成，也可以跳过
          if [ -f resources/yourapp.desktop ]; then
            mkdir -p "$APP_DIR/usr/share/applications"
            cp resources/yourapp.desktop "$APP_DIR/usr/share/applications/"
          fi
          if [ -f resources/yourapp.png ]; then
            mkdir -p "$APP_DIR/usr/share/icons/hicolor/256x256/apps"
            cp resources/yourapp.png "$APP_DIR/usr/share/icons/hicolor/256x256/apps/"
          fi

      # ---------- 5. AppImage ----------
      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(which qmake)"

          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage

          # 产物名通常为 YourApp-x86_64.AppImage，统一加上版本号
          VERSION="${GITHUB_REF_NAME#v}"
          mv YourApp*.AppImage "YourApp-${VERSION}-linux-x86_64.AppImage"

      # ---------- 6. deb + rpm (复用 AppDir) ----------
      - name: Build deb and rpm with fpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          for target in deb rpm; do
            fpm -s dir -t "$target" \
              -a x86_64 \
              -n yourapp \
              -v "$VERSION" \
              --maintainer "you@example.com" \
              --description "Your application description" \
              --url "https://github.com/${{ github.repository }}" \
              --license "MIT" \
              -p "YourApp-${VERSION}-1.x86_64.${target}" \
              AppDir/=/
          done

      # ---------- 7. Arch Linux 原生包 (容器中 makepkg) ----------
      - name: Build Arch Linux package
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            archlinux:latest \
            bash -c '
              set -e
              pacman -Sy --noconfirm base-devel qt6-base qt6-tools
              useradd -m builder
              chown -R builder:builder /src
              su builder -c "
                cd /src
                makepkg -s --noconfirm --skipchecksums
              "
            '

      # ---------- 8. 统一上传四类产物 ----------
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            YourApp-*-linux-x86_64.AppImage
            YourApp-*-1.x86_64.deb
            YourApp-*-1.x86_64.rpm
            *.pkg.tar.zst
